services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc
    restart: unless-stopped
    env_file: server.env
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
    # Lets `./mc attach` reach the live server console.
    tty: true
    stdin_open: true
    # Give the server time to save the world when stopping.
    stop_grace_period: 2m
