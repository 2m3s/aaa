services:
  mc:
    # The Java version is picked per server type by ./mc mode (stored in .env).
    # Minecraft 1.21.1 hybrids need java21; Mohist 1.20.1 needs java17.
    image: itzg/minecraft-server:${JAVA_TAG:-java21}
    container_name: mc
    restart: unless-stopped
    # Reads server.env on every start (see scripts/mc-entry.sh).
    entrypoint: ["/bin/bash", "/aaa/scripts/mc-entry.sh"]
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
      - ./:/aaa:ro
    # Lets `docker attach mc` reach the live server console.
    tty: true
    stdin_open: true
    # Give the server time to save the world when stopping.
    stop_grace_period: 2m

  panel:
    # Web panel: console, file manager, restart, backups. http://SERVER-IP:8080
    image: python:3.12-alpine
    container_name: mc-panel
    restart: unless-stopped
    command: ["python3", "-u", "/aaa/panel/panel.py"]
    environment:
      PANEL_ROOT: /aaa
    ports:
      - "${PANEL_PORT:-8080}:8080"
    volumes:
      - ./:/aaa
